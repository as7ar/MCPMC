port: 3001
enable-log: false

oauth:
  enable: false
  authorizeUrl: "https://accounts.google.com/o/oauth2/auth"
  accessTokenUrl: "https://oauth2.googleapis.com/token"
  requestMethod: POST
  clientId: ""
  clientSecret: ""
  scope:
    - "email"

bearer:
  enable: true

  token-generator:
    # disable to change "-"
    path: "/token-generate"
    token-type: "USER"